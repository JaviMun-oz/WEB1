<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Tetris</h1>
    <p>Use Left and Right Arrow to move. Use Up Arrow to rotate clockwise. Use Down Arrow to slam down.</p>
    <p id="score">Score: 0</p>
    <div id="board" role="img" aria-label="A 10-column, 20-row Tetris board with falling tetrominoes and settled blocks."></div>
    <p id="status" role="status">Press Start to play.</p>
    <div>
        <button id="start" type="button">Start</button>
        <button id="restart" type="button" hidden>Restart</button>
    </div>
</body>
</html>
